<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البسيخومتري - تحدي المقابلات</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #F0F4F8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .screen { background: #FFFFFF; border-radius: 12px; width: 100%; max-width: 600px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
    .hidden { display: none !important; }
    
    /* Input & Buttons */
    input[type="text"] { font-size: 18px; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; text-align: center; width: 80%; margin-bottom: 20px; }
    .btn { background: #3B82F6; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2563EB; }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
    
    /* Header Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; padding-bottom: 10px; font-size: 14px; font-weight: bold; color: #1F2937; }
    .timer { font-size: 18px; color: #EF4444; font-weight: bold; }
    
    /* Quiz Content */
    .analogy-title { font-size: 28px; color: #1E40AF; margin: 20px 0 10px 0; }
    .hint-btn { background: #FDE68A; color: #92400E; border: none; padding: 6px 14px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
    .words-box { font-size: 14px; color: #4B5563; min-height: 20px; margin-bottom: 15px; }
    
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { background: #F3F4F6; color: #1F2937; border: none; padding: 12px 15px; font-size: 16px; text-align: right; border-radius: 6px; cursor: pointer; }
    .option-btn.correct { background: #D1FAE5 !important; color: #065F46 !important; }
    .option-btn.wrong { background: #FEE2E2 !important; color: #991B1B !important; }
    
    .result-text { font-size: 18px; font-weight: bold; min-height: 25px; margin: 10px 0; }
    .exp-text { font-size: 14px; color: #374151; white-space: pre-line; text-align: right; background: #F9FAFB; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- WELCOME SCREEN -->
  <div id="welcome-screen" class="screen">
    <h1 style="color: #1E3A8A;">🧠 تحدي المقابلات</h1>
    <p style="color: #4B5563;">اختبر قدراتك اللغوية وتتبع إجاباتك الصحيحة</p>
    <label style="display:block; margin: 20px 0 5px;">أدخل اسمك لتبدأ:</label>
    <input type="text" id="player-name-input" placeholder="اسمك هنا..." />
    <br>
    <button class="btn" onclick="startGame()">ابدأ التحدي الآن 🚀</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="screen hidden">
    <div class="header-bar">
      <span id="info-label">👤 اللاعب: </span>
      <span id="timer-label" class="timer">⏳ 45</span>
    </div>

    <div class="analogy-title" id="analogy-label">...</div>
    
    <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 مساعدة في معاني الكلمات</button>
    <div class="words-box" id="words-label"></div>

    <div class="options-grid" id="options-container"></div>

    <div class="result-text" id="result-label"></div>
    <div class="exp-text" id="exp-label"></div>

    <div style="margin-top: 20px;">
      <button class="btn" style="background:#10B981; width:100%;" id="next-btn" onclick="nextQuestion()" disabled>السؤال التالي ⬅️</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="screen hidden">
    <h1 style="color: #10B981;" id="end-title">🎉 انتهى التحدي!</h1>
    <div style="background: #FFFFFF; border: 1px solid #3B82F6; border-radius: 8px; padding: 20px; margin: 20px 0;">
      <h3 style="margin: 0; color: #3B82F6;">الإجابات الصحيحة</h3>
      <h2 style="font-size: 32px; margin: 10px 0 0 0; color: #3B82F6;" id="final-score">0 / 0</h2>
    </div>
    <button class="btn" style="background: #EF4444;" onclick="location.reload()">إعادة اللعب 🔄</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
